<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07120e"/>
      <stop offset="0.46" stop-color="#13241a"/>
      <stop offset="0.62" stop-color="#3a3415"/>
      <stop offset="0.74" stop-color="#1a1408"/>
      <stop offset="1" stop-color="#070806"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#e9b85a" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#c87a32" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#sky)"/>
  <ellipse cx="300" cy="278" rx="320" ry="150" fill="url(#sun)"/>

  <!-- distant ridgeline -->
  <path d="M0 262 Q150 232 300 256 T600 248 L600 450 L0 450 Z" fill="#0c150f" opacity="0.85"/>

  <!-- canopy silhouettes -->
  <g fill="#060c08">
    <path d="M0 300 q40 -70 80 -10 q30 -55 70 0 q40 -60 80 -6 q35 -50 80 4 q40 -64 84 -2 q34 -46 78 6 q40 -52 78 2 L600 320 L600 450 L0 450 Z"/>
  </g>
  <g fill="#03070500" stroke="#0a1410" stroke-width="2" opacity="0.6">
    <line x1="120" y1="300" x2="120" y2="450"/>
    <line x1="240" y1="296" x2="240" y2="450"/>
    <line x1="360" y1="300" x2="360" y2="450"/>
    <line x1="470" y1="296" x2="470" y2="450"/>
  </g>

  <!-- mist -->
  <rect x="0" y="300" width="600" height="60" fill="#7d8f7a" opacity="0.06"/>

  <rect width="600" height="450" fill="url(#vig)"/>
</svg>
